[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ann-assistant"
version = "0.1.0"
description = "A modular desktop AI Assistant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.8.0.2",
]

[project.scripts]
ann = "ann.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
